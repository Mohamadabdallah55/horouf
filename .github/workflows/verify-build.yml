name: Verify Horouf
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Game rules
        run: bun run test
